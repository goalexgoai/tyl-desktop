name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Node.js
        # electron-builder install-app-deps (postinstall) replaces better-sqlite3
        # with an Electron-compiled binary; rebuild it for plain Node so tests work.
        run: npm rebuild better-sqlite3

      - name: Run tests
        run: ./node_modules/.bin/jest --forceExit
