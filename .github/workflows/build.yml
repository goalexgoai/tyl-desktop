name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-latest   # macos-14 / Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron (arm64)
        run: npx electron-builder install-app-deps

      - name: Verify better-sqlite3 binary is arm64
        run: |
          BSNODE="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if [ -f "$BSNODE" ]; then
            ARCH=$(file "$BSNODE")
            echo "Binary: $ARCH"
            echo "$ARCH" | grep -q "arm64" || (echo "ERROR: expected arm64, got wrong arch" && exit 1)
          else
            echo "WARNING: better_sqlite3.node not found at expected path"
          fi

      - name: Build Mac arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --arm64 --publish never

      - name: Upload Mac arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-arm64
          path: dist/*.dmg

  build-mac-x64:
    runs-on: macos-latest   # cross-compile x64 on Apple Silicon runner (avoids macos-13 queue)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron (x64 via cross-compile)
        run: npx electron-builder install-app-deps --arch x64

      - name: Verify better-sqlite3 binary is x86_64
        run: |
          BSNODE="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if [ -f "$BSNODE" ]; then
            ARCH=$(file "$BSNODE")
            echo "Binary: $ARCH"
            echo "$ARCH" | grep -q "x86_64" || (echo "ERROR: expected x86_64, got wrong arch" && exit 1)
          else
            echo "WARNING: better_sqlite3.node not found at expected path"
          fi

      - name: Build Mac x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --publish never

      - name: Upload Mac x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-x64
          path: dist/*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron (x64)
        run: npx electron-builder install-app-deps

      - name: Build Windows
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          # latest.yml + blockmap are what electron-updater reads for Windows
          # auto-update. Without them in the release, installs never update.
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  release:
    needs: [build-mac-arm64, build-mac-x64, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Mac arm64 build
        uses: actions/download-artifact@v4
        with:
          name: mac-build-arm64
          path: dist/

      - name: Download Mac x64 build
        uses: actions/download-artifact@v4
        with:
          name: mac-build-x64
          path: dist/

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: win-build
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.exe.blockmap
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing latest.yml is what switches Windows auto-update on: every
      # installed copy that checks in will download this release and install it
      # on next quit. Gated on the repo variable AUTO_UPDATE so a release can be
      # validated first; to turn it on for a release that went out without it:
      #   gh release upload vX.Y.Z latest.yml   (from the win-build artifact)
      - name: Publish Windows auto-update manifest
        if: ${{ vars.AUTO_UPDATE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
